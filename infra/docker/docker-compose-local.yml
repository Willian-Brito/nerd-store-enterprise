name: nerdstore

x-common-variables: &common-variables
    ASPNETCORE_ENVIRONMENT: Docker
    ASPNETCORE_URLS: https://+:443;http://+:80
    ASPNETCORE_Kestrel__Certificates__Default__Password: 9HoGMnb7Lu8NFdHBz4Vq2rtKivzMhmMXhtvuB4TZcLMmbWfFmDQCjJeLURAJ4GYe
    ASPNETCORE_Kestrel__Certificates__Default__Path: /https/nerdstore.io-localhost.pfx
    AppSettings__DatabaseType: Postgre

include:
    - docker-common-resources.yml

services:
    
    database-identity:
        image: postgres:16
        container_name: nerdstore-database-identity
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s  

    api-identity:
        image: willianbrito00/nerdstore-api-identity:${TAG}
        container_name: nerdstore-api-identity
        build:
            context: ../../src
            dockerfile: ./services/Identity/NSE.Identity.API/Dockerfile        
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-identity;Database=DBUsers;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            generate-pfx:
                condition: service_completed_successfully
            database-identity:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-cart:
        image: postgres:16
        container_name: nerdstore-database-cart
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s 

    api-cart:
        image: willianbrito00/nerdstore-api-cart:${TAG}
        container_name: nerdstore-api-cart
        build:
            context: ../../src
            dockerfile: ./services/ShoppingCart/NSE.ShoppingCart.API/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-cart;Database=DBShoppingCart;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            database-cart:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-catalog:
        image: postgres:16
        container_name: nerdstore-database-catalog
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s 

    api-catalog:
        image: willianbrito00/nerdstore-api-catalog:${TAG}
        container_name: nerdstore-api-catalog
        build:
            context: ../../src
            dockerfile: ./services/Catalog/NSE.Catalog.API/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-catalog;Database=DBCatalog;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            database-catalog:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-customer:
        image: postgres:16
        container_name: nerdstore-database-customer
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s 

    api-customers:
        image: willianbrito00/nerdstore-api-customers:${TAG}
        container_name: nerdstore-api-customers
        build:
            context: ../../src
            dockerfile: ./services/Customer/NSE.Customer.API/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-customer;Database=DBCustomer;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            database-customer:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-order:
        image: mcr.microsoft.com/mssql/server:2019-latest
        container_name: nerdstore-database-order
        ports:
            - "1433:1433"
        expose:
            - 1433
        environment:
            SA_PASSWORD: "MyDB@123"
            ACCEPT_EULA: "Y"
        healthcheck:
            test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -C -S localhost -U sa -P MyDB@123 -Q 'SELECT 1'" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s

    api-order:
        image: willianbrito00/nerdstore-api-order:${TAG}
        container_name: nerdstore-api-order
        build:
            context: ../../src
            dockerfile: ./services/Order/NSE.Order.API/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-order,1433;Database=DBOrder;User Id=sa;Password=MyDB@123;TrustServerCertificate=True;"
            AppSettings__DatabaseType: SqlServer
            Logging__Console__FormatterName: ""
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            database-order:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-payment:
        image: postgres:16
        container_name: nerdstore-database-payment
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s 

    api-payment:
        image: willianbrito00/nerdstore-api-payment:${TAG}
        container_name: nerdstore-api-payment
        build:
            context: ../../src
            dockerfile: ./services/Payment/NSE.Payment.API/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-payment;Database=DBPayment;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            api-order:
                condition: service_started
            database-payment:
                condition: service_started
            rabbitmq:
                condition: service_healthy
            # kafka-broker:
            #     condition: service_started

    database-status:
        image: postgres:16
        container_name: nerdstore-database-status
        expose:
            - 5432
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: MyDB@123
        healthcheck:                                                                    
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 3s
            timeout: 5s
            retries: 10
            start_period: 5s 

    api-bff-checkout:
        image: willianbrito00/nerdstore-api-bff-checkout:${TAG}
        container_name: nerdstore-api-bff-checkout
        build:
            context: ../../src
            dockerfile: ./api-gateways/Checkout/NSE.Bff.Checkout/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-status;Database=DBStatus;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
        depends_on:
            api-identity:
                condition: service_started
            api-cart:
                condition: service_started
            api-payment:
                condition: service_started
            api-order:
                condition: service_started
            database-status:
                condition: service_started

    web-mvc:
        image: willianbrito00/nerdstore-web-mvc-ecommerce:${TAG}
        container_name: nerdstore-web-mvc-ecommerce
        build:
            context: ../../src
            dockerfile: ./web/MVC/NSE.WebApp.MVC/Dockerfile        
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-status;Database=DBStatus;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
            LC_ALL: "en_US.UTF-8"
            LANG: "en_US.UTF-8"
            # Change the two lines above to your culture (ex pt_BR)
            USE_HTTPS_REDIRECTION: "false"
        expose:
            - 80
            - 443
        volumes:
            - ./certs:/https:ro
            - dpkeys:/var/data_protection_keys/
        depends_on:
            api-catalog:
                condition: service_started
            api-identity:
                condition: service_started
            api-customers:
                condition: service_started
            api-bff-checkout:
                condition: service_started
            database-status:
                condition: service_started


    web-status:
        image: willianbrito00/nerdstore-web-status:${TAG}
        container_name: nerdstore-web-status
        build:
            context: ../../src
            dockerfile: ./web/Status/NSE.WebApp.Status/Dockerfile
        restart: always
        environment:
            <<: *common-variables
            CUSTOMCONNSTR_DefaultConnection: "Server=database-status;Database=DBStatus;Port=5432;User Id=postgres;Password=MyDB@123;CommandTimeout=500"
        volumes:
            - ./certs:/https:ro
            - ./certs/nerdstore.crt:/usr/local/share/ca-certificates/nerdstore.crt
        depends_on:
            api-identity:
                condition: service_started
            database-status:
                condition: service_started

volumes:
    dpkeys:
    nginx-certs:
