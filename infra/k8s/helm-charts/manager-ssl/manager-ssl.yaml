apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-manager
  namespace: nerdstore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: nerdstore
  name: secret-manager-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manage-secrets
  namespace: nerdstore
subjects:
- kind: ServiceAccount
  name: secret-manager
  namespace: nerdstore
roleRef:
  kind: Role
  name: secret-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ssl-manager-job
  namespace: nerdstore
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          name: ssl-manager
        spec:
          containers:
          - name: ssl-manager
            image: nicolaka/netshoot
            volumeMounts:
            - name: script
              mountPath: /scripts
            command: ["/bin/sh"]
            args: ["/scripts/script_secret.sh"]
          volumes:
          - name: script
            configMap:
              name: secret-creation-script    
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          serviceAccountName: secret-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-creation-script
  namespace: nerdstore
data:
  script_secret.sh: |
    #!/bin/sh
    criar_secret() {
        echo "Criando secret"
        CERT_PASSWORD=$(head /dev/urandom | tr -dc 'A-Za-z0-9!@#$%^&*()_+' | head -c 32; echo '')
        CERT_B64_PASSWORD=$(echo -n "$CERT_PASSWORD" | base64)
        openssl genrsa -out nerdstore.rsa 2048
        openssl req -sha256 -new -key nerdstore.rsa -out nerdstore.csr -subj '/CN=localhost'
        openssl x509 -req -sha256 -days 365 -in nerdstore.csr -signkey nerdstore.rsa -out nerdstore.crt
        openssl pkcs12 -export -out nerdstore.academy-localhost.pfx -inkey nerdstore.rsa -in nerdstore.crt -password pass:$CERT_PASSWORD
        PFX_B64=$(cat nerdstore.academy-localhost.pfx | base64 | tr -d '\n')
        SECRET_PAYLOAD=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"nerdstore-ssl"},"type":"Opaque","data":{"nerdstore.academy-localhost.pfx":"%s","password":"%s"}}' $PFX_B64 $CERT_B64_PASSWORD)
        curl --cacert $CACERT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -X POST -d "$SECRET_PAYLOAD" $APISERVER/api/v1/namespaces/nerdstore/secrets
    }

    criado_ha_mais_de_um_ano(){
        CREATED=$(echo $SECRET | jq -r '.metadata.creationTimestamp')
        IS_OLDER=$(python -c "from datetime import datetime, timedelta, timezone; \
                                created = datetime.fromisoformat('${CREATED}'); \
                                year_ago = datetime.now(timezone.utc) - timedelta(days=365); \
                                print(created < year_ago)")
        if [ "$IS_OLDER" = "True" ]; then
            echo "true"
        else
            echo "false"
        fi
    }

    deletar_secret(){
        echo "Deletando secret"
        curl --cacert $CACERT -H "Authorization: Bearer $TOKEN" -X DELETE $APISERVER/api/v1/namespaces/nerdstore/secrets/nerdstore-ssl
    }

    APISERVER=https://kubernetes.default.svc
    SERVICEACCOUNT=/var/run/secrets/kubernetes.io/serviceaccount 
    TOKEN=$(cat ${SERVICEACCOUNT}/token) 
    CACERT=${SERVICEACCOUNT}/ca.crt

    SECRET=$(curl -s --cacert $CACERT -H "Authorization: Bearer $TOKEN" -X GET $APISERVER/api/v1/namespaces/nerdstore/secrets/nerdstore-ssl)
    HTTP_STATUS=$(echo $SECRET | jq -r '.code // 200')

    if [ "$HTTP_STATUS" = "404" ]; then
        echo "Secret nao foi encontrado"
        criar_secret
    elif [ $(criado_ha_mais_de_um_ano) = "true" ]; then
        echo "Secret expirou"
        # deletar a secret
        criar_secret
    else
        echo "Secret valido"
    fi

