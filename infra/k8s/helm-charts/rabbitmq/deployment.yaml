apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      run: rabbitmq
  template:
    metadata:
      creationTimestamp: null
      labels:
        run: rabbitmq
        environment: test
        tier: queue
        app: nerd-store
      name: rabbitmq
      namespace: infra
    spec:
      containers:
      - image: rabbitmq:3-management
        name: rabbitmq
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "nerdstore"
        - name: RABBITMQ_DEFAULT_PASS
          value: "nerdstore"
        resources: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
